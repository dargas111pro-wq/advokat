<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест кнопок</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; }
        .btn { display: block; width: 100%; padding: 15px; margin-bottom: 10px; background: #333; color: white; border: none; border-radius: 10px; font-size: 18px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="screen1">
        <h1>Главный экран</h1>
        <button class="btn" onclick="show(2)">Перейти на Экран 2</button>
    </div>

    <div id="screen2" class="hidden">
        <h1>Экран 2 (Каталог)</h1>
        <button class="btn" onclick="show(3)">Выбрать товар</button>
        <button class="btn" onclick="show(1)">Назад</button>
    </div>

    <div id="screen3" class="hidden">
        <h1>Экран 3 (Оплата)</h1>
        <p>Здесь будет оплата</p>
        <button class="btn" onclick="show(2)">Назад</button>
    </div>

    <script>
        function show(num) {
            document.getElementById('screen1').classList.add('hidden');
            document.getElementById('screen2').classList.add('hidden');
            document.getElementById('screen3').classList.add('hidden');
            document.getElementById('screen' + num).classList.remove('hidden');
        }
    </script>
</body>
</html>
